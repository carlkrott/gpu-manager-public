title = "GPUManager source-only gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Known public identifiers that trigger generic-api-key heuristics"
paths = [
    '''scripts/gemma_broker/runtime\.py$''',
    '''scripts/gpu-manager\.py$''',
]
regexes = [
    '''^(?:self\.)?api_service$''',
    '''^wan-t2v-esrgan-rife$''',
]
